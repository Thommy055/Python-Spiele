
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Streichholzspiel 21</title>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>

    <style>
        body {
            background: #171717;
            color: white;
            font-family: Consolas, monospace;
            padding: 20px;
        }

        #terminal {
            background: #000;
            color: #e5e5e5;
            padding: 20px;
            min-height: 400px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        #eingabe {
            background: #000;
            color: #fff;
            border: none;
            outline: none;
            font: inherit;
            width: 90%;
        }
    </style>
</head>
<body>
    <h2>Streichholzspiel 21</h2>

    <div id="terminal">Python wird geladen...</div>
    <input id="eingabe" autocomplete="off"
           placeholder="Hier eingeben und Enter drücken">

    <script>
        const terminal = document.getElementById("terminal");
        const eingabe = document.getElementById("eingabe");

        function ausgeben(text) {
            terminal.textContent += text;
            window.scrollTo(0, document.body.scrollHeight);
        }

        async function starten() {
            try {
                const pyodide = await loadPyodide();

                const antwort = await fetch("./spiel.py");
                if (!antwort.ok) {
                    throw new Error("spiel.py konnte nicht geladen werden.");
                }

                const code = await antwort.text();

                terminal.textContent = "";

              
const decoder = new TextDecoder("utf-8");

pyodide.setStdout({
    raw: byte => {
        const text = decoder.decode(
            new Uint8Array([byte]),
            { stream: true }
        );
        if (text) {
            ausgeben(text);
        }
    }
});


                pyodide.setStderr({
                    batched: text => ausgeben(text + "\n")
                });

                
const eingabeAbwarten = () => new Promise(resolve => {
    eingabe.disabled = false;
    eingabe.focus();

    eingabe.onkeydown = event => {
        if (event.key === "Enter") {
            const wert = eingabe.value;
            eingabe.value = "";
            eingabe.disabled = true;
            eingabe.onkeydown = null;

            ausgeben(wert + "\n");
            resolve(wert);
        }
    };
});

pyodide.globals.set("browser_eingabe", eingabeAbwarten);

                

const pythonCode = `
import ast
import asyncio
import inspect
import time

async def browser_input(frage=""):
    print(frage, end="", flush=True)
    return await browser_eingabe()

quelle = ${JSON.stringify(code)}

# Python-Code so vorbereiten, dass await erlaubt ist
baum = ast.parse(quelle)

# time.sleep() durch asynchrone Pausen ersetzen
class PausenAnpassen(ast.NodeTransformer):
    def visit_Call(self, node):
        self.generic_visit(node)
        if (
            isinstance(node.func, ast.Attribute)
            and isinstance(node.func.value, ast.Name)
            and node.func.value.id == "time"
            and node.func.attr == "sleep"
        ):
            node.func = ast.Attribute(
                value=ast.Name(id="asyncio", ctx=ast.Load()),
                attr="sleep",
                ctx=ast.Load()
            )
            return ast.copy_location(
                ast.Await(value=node), node
            )
        return node

baum = PausenAnpassen().visit(baum)
ast.fix_missing_locations(baum)

programm = compile(
    baum, "spiel.py", "exec",
    flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT
)

ergebnis = eval(programm, globals())

if inspect.isawaitable(ergebnis):
    await ergebnis
`;

await pyodide.runPythonAsync(pythonCode);



            } catch (fehler) {
                ausgeben("\nFehler: " + fehler.message);
            }
        }

        starten();
    </script>
</body>
</html>
