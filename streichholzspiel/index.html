
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Streichholzspiel 21</title>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>

    <style>
        body {
            background: #171717;
            color: white;
            font-family: Consolas, monospace;
            padding: 20px;
        }

        #terminal {
            background: #000;
            color: #e5e5e5;
            padding: 20px;
            min-height: 400px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        #eingabe {
            background: #000;
            color: #fff;
            border: none;
            outline: none;
            font: inherit;
            width: 90%;
        }
    </style>
</head>
<body>
    <h2>Streichholzspiel 21</h2>

    <div id="terminal">Python wird geladen...</div>
    <input id="eingabe" autocomplete="off"
           placeholder="Hier eingeben und Enter drücken">

    <script>
        const terminal = document.getElementById("terminal");
        const eingabe = document.getElementById("eingabe");

        function ausgeben(text) {
            terminal.textContent += text;
            window.scrollTo(0, document.body.scrollHeight);
        }

        async function starten() {
            try {
                const pyodide = await loadPyodide();

                const antwort = await fetch("./spiel.py");
                if (!antwort.ok) {
                    throw new Error("spiel.py konnte nicht geladen werden.");
                }

                const code = await antwort.text();

                terminal.textContent = "";

                pyodide.setStdout({
                    batched: text => ausgeben(text + "\n")
                });

                pyodide.setStderr({
                    batched: text => ausgeben(text + "\n")
                });

                // Die Eingabefunktion ergänzen wir im nächsten Schritt.
                ausgeben("Python ist bereit!\n");
                ausgeben("Die Spieleingabe wird noch eingerichtet.\n");

            } catch (fehler) {
                ausgeben("\nFehler: " + fehler.message);
            }
        }

        starten();
    </script>
</body>
</html>
